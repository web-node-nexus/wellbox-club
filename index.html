<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jewellbox Club - Digital Gold Showroom | Buy Gold at Wholesale Prices</title>
    <meta name="description" content="India's #1 Digital Gold Showroom. Buy 22K & 24K BIS Hallmarked Gold at 30% cheaper than market price. Direct from manufacturer, no middlemen. Earn commissions while you save." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.light, html.light body { background-color: #ffffff !important; color: #000000; }
      html.dark, html.dark body { background-color: #1a1a1a !important; color: #ffffff; }
    </style>
    <script>
      (function () {
        const isInIframe = window.self !== window.top;
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") applyThemeToDOM(theme);
            }
          });
        } else {
          applyThemeToDOM("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
